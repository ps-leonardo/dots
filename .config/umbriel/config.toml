# Umbriel starting configuration
#
# Copy this file to ~/.config/umbriel/config.toml. Most changes apply when the
# file is saved. Check edits with `umbriel config validate`.
#
# Complete reference: https://docs.noctalia.dev/umbriel/
#
# Commented settings below are examples, not built-in defaults.

# ==============================================================================
# Includes

# Optional split configuration
# https://docs.noctalia.dev/umbriel/configuration/#include
[include]
files = ["keybinds.toml", "monitors.toml", "windowrules.toml", "appearance.toml", "env.toml", "/usr/share/umbriel/effects/border/pulse/effect.toml", "/usr/share/umbriel/effects/animation/reveal/effect.toml"]

[include.optional]
files = ["noctalia.toml"]

[general]
autostart = ["noctalia", "dbus-update-activation-environment", "equibop", "steam", "ghostty --gtk-single-instance=true --quit-after-last-window-closed=false --initial-window=false"]

[input.keyboard]
layout = "br,us"
numlock_toggle = true

[input.cursor]
size = 24
follows_focus = true

[input.focus]
follows_mouse = true

[layout]
mode = "dwindle"
extent_presets = [0.333, 0.5, 0.667]

[layout.scrolling]
default_extent_fraction = 1

[layout.dwindle]
preserve_split = false
