[keybinds]
# Window/session-actions
"Mod+Q" = { action = "window-close", repeat = false }
"Mod+A" = "spawn:noctalia msg panel-toggle launcher"
"Alt+Return" = "window-toggle-fullscreen"

# Application shortcuts
"Mod+F" = { action = "spawn:librewolf", repeat = false }
"Mod+T" = { action = "spawn:ghostty --gtk-single-instance=true", repeat = false }
"Mod+E" = { action = "spawn:nautilus", repeat = false }

# Focus and movement
"Mod+Left" = "window-focus-left"
"Mod+Down" = "window-focus-down"
"Mod+Up" = "window-focus-up"
"Mod+Right" = "window-focus-right"
"Mod+Alt+Left" = "column-move-left"
"Mod+Alt+Down" = "window-move-down"
"Mod+Alt+Up" = "window-move-up"
"Mod+Alt+Right" = "column-move-right"
"Mod+W" = "window-toggle-floating"

# Media Control
"XF86AudioRaiseVolume" = "spawn:noctalia msg volume-up"
"XF86AudioLowerVolume" = "spawn:noctalia msg volume-down"
"XF86AudioMute" = "spawn:noctalia msg volume-mute"
"XF86AudioPlay" = "spawn:playerctl play-pause"
"XF86AudioNext" = "spawn:playerctl next"
"XF86AudioPrev" = "spawn:playerctl previous"

# Noctalia IPC
"Mod+P" = "spawn:noctalia msg screenshot-region"
"Mod+Shift+R" = "spawn:noctalia msg plugin noctalia/screen_recorder:service all toggle"
"Mod+V" = "spawn:noctalia msg panel-toggle clipboard"
"Mod+Shift+W" = "spawn:noctalia msg panel-toggle noctalia/wallhaven:browser"
"Mod+L" = "spawn:noctalia msg session lock"

# Switch Keyboard Layout
"Mod+Space" = "keyboard-layout-next"

# Workspaces
"Mod+1" = 'workspace-switch:"1"'
"Mod+2" = 'workspace-switch:"2"'
"Mod+3" = 'workspace-switch:"3"'
"Mod+4" = 'workspace-switch:"4"'
"Mod+5" = 'workspace-switch:"5"'
"Mod+6" = 'workspace-switch:"6"'
"Mod+7" = 'workspace-switch:"7"'
"Mod+8" = 'workspace-switch:"8"'
"Mod+9" = 'workspace-switch:"9"'
"Mod+0" = 'workspace-switch:"10"'
"Mod+Shift+1" = 'window-move-to-workspace:"1"'
"Mod+Shift+2" = 'window-move-to-workspace:"2"'
"Mod+Shift+3" = 'window-move-to-workspace:"3"'
"Mod+Shift+4" = 'window-move-to-workspace:"4"'
"Mod+Shift+5" = 'window-move-to-workspace:"5"'
"Mod+Shift+6" = 'window-move-to-workspace:"6"'
"Mod+Shift+7" = 'window-move-to-workspace:"7"'
"Mod+Shift+8" = 'window-move-to-workspace:"8"'
"Mod+Shift+9" = 'window-move-to-workspace:"9"'
"Mod+Shift+0" = 'window-move-to-workspace:"10"'

# Resize Windows
"Mod+Shift+Left" = "window-modify-primary-extent:.01"
"Mod+Shift+Right" = "window-modify-primary-extent:-.01"
"Mod+Shift+Up" = "window-modify-secondary-extent:.01"
"Mod+Shift+Down" = "window-modify-secondary-extent:-.01"

# Scratchpad
"Mod+Alt+S" = "window-toggle-scratchpad:music"
"Mod+S" = "scratchpad-toggle:music"
