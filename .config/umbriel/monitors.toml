[output.DP-1]
mode = "2560x1080@75"
position = [0, 0]
scale = 1
workspaces = ["1", "3", "5", "7", "9"]
vrr = "fullscreen"
hdr = "auto"
bit_depth = 8
tearing = true

[output.DP-2]
mode = "1366x768"
position = [2560, 312]
scale = 1.0
vrr = "disabled"
hdr = "off"
workspaces = ["2", "4", "6", "8", "10"]

[[scratchpad]]
name = "music"

[[workspace]]
name = "1"
